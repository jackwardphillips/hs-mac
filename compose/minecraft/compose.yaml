services:
  minecraft:
    image: itzg/minecraft-server:java21@sha256:b8e2c76dc48c635966e99bd184c1eb4942cce482b6aa48af5630543c5bc32870
    container_name: minecraft

    restart: unless-stopped
    stop_grace_period: 2m

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TZ: America/New_York

      MODPACK_PLATFORM: AUTO_CURSEFORGE
      CF_SLUG: custom
      CF_MODPACK_ZIP: /modpacks/Briancraft-II-Server-1.0.zip

      INIT_MEMORY: 2G
      MAX_MEMORY: 3584M
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      MAX_PLAYERS: "8"
      MOTD: "Now featuring ducks!"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "8"
      MAX_TICK_TIME: "-1"

      ENABLE_AUTOPAUSE: "TRUE"
      AUTOPAUSE_TIMEOUT_EST: "600"
      AUTOPAUSE_TIMEOUT_INIT: "600"
      AUTOPAUSE_TIMEOUT_KN: "120"

    volumes:
      - ../../minecraft/briancraft-ii:/data
      - ../../minecraft/modpacks/Briancraft-II-Server-1.0.zip:/modpacks/Briancraft-II-Server-1.0.zip:ro

    healthcheck:
      test: mc-health
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 10
